<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="ITM(SLS) BARODA UNIVERSITY | GNUMS Login">
    <title>ITM(SLS) BARODA UNIVERSITY | GNUMS Login</title>

    <!-- CSS Dependencies -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        body.login {
            background-color: #ffffff;
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #form1 {
            display: flex;
            min-height: 100vh;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .login-form {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .row.bs-reset {
            display: flex;
            width: 100%;
            min-height: 100vh;
            margin: 0 !important;
        }

        .col-md-8 {
            flex: 1.3;
            position: relative;
            overflow: hidden;
            display: block;
            height: 100vh;
        }

        @media (max-width: 991px) {
            .col-md-8 {
                display: none !important;
            }
        }

        .login-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        .col-md-8::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 34, 64, 0.35) 0%, rgba(6, 19, 37, 0.15) 100%);
            z-index: 3;
            pointer-events: none;
        }

        .col-md-4.login-container {
            width: 450px;
            min-width: 400px;
            max-width: 500px;
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px !important;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.05);
            z-index: 10;
            box-sizing: border-box;
            height: 100vh;
            overflow-y: auto;
        }

        @media (max-width: 991px) {
            .col-md-4.login-container {
                width: 100%;
                max-width: 100%;
                min-width: 100%;
                padding: 30px 20px !important;
            }
        }

        .login-content {
            width: 100%;
        }

        .login-content .row {
            margin: 0;
        }

        #imgFooterLogo {
            max-width: 280px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 30px auto;
        }

        .slogan {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #5a738e;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #e02222;
            margin-right: 4px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            height: 34px;
            padding: 6px 12px;
            font-size: 14px;
            color: #555;
            background-color: #ffffff;
            border: 1px solid #c2cad8;
            border-radius: 0px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            border-color: #93a1bb;
            box-shadow: none;
        }

        #rblRole {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }

        #rblRole input[type="radio"] {
            margin: 0;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #a92328; /* Baroda University Maroon */
        }

        #rblRole label {
            font-size: 14px;
            color: #555;
            font-weight: normal;
            cursor: pointer;
            display: inline;
            margin-left: 5px;
        }

        .mt-checkbox {
            display: flex;
            align-items: center;
            margin-top: 8px;
            cursor: pointer;
        }

        .mt-checkbox input {
            margin: 0 8px 0 0;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #a92328;
        }

        .mt-checkbox span {
            font-size: 14px;
            color: #555;
            font-weight: normal;
        }

        #btnLogin,
        #btnForgotPassword {
            display: inline-block;
            height: 34px;
            padding: 6px 15px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 0px;
            text-align: center;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.15s ease-in-out;
        }

        #btnLogin {
            background-color: #36c6d3;
            color: #ffffff;
            margin-right: 5px;
        }

        #btnLogin:hover {
            background-color: #2bb8c4;
        }

        #btnForgotPassword {
            background-color: #ed6b75;
            color: #ffffff;
        }

        #btnForgotPassword:hover {
            background-color: #e7505a;
        }

        #hlLoginForPassoutStudent {
            color: #337ab7;
            text-decoration: underline;
            font-size: 14px;
            font-weight: normal;
            display: inline-block;
            margin-top: 15px;
            text-align: left;
        }

        #hlLoginForPassoutStudent:hover {
            color: #23527c;
        }

        .font-grey-cascasde {
            color: #95a5a6;
            font-size: 14px;
        }
        .font-grey-cascasde small {
            font-size: 14px;
        }

        .alert-danger {
            background-color: #fbe1e3;
            color: #e73d4a;
            border: 1px solid #fbe1e3;
            border-radius: 0px;
            font-size: 12px;
        }

        .margin-top-10 {
            margin-top: 10px;
        }

        .g-px-15 {
            padding-left: 15px;
            padding-right: 15px;
        }

        .g-py-15 {
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .text-center {
            text-align: center;
        }

        .text-nowrap {
            white-space: nowrap;
        }

        .password-info {
            background-color: #dff0d8;
            color: #3c763d;
            padding: 0;
            font-size: 9px;
            border-radius: 50%;
            margin-left: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            cursor: help;
            border: 1px solid #d6e9c6;
        }
    </style>
</head>

<body class="login">
    <form name="form1" method="post" action="./Login.aspx" id="form1" class="user-login-5">
        <!-- Hidden elements matching GNUMS spec -->
        <div>
            <input type="hidden" name="hfWidth" id="hfWidth">
            <input type="hidden" name="hfHeight" id="hfHeight">
            <input type="hidden" name="hfLoginMethod" id="hfLoginMethod" value="Password">
        </div>

        <div class="login-form">
            <div class="row bs-reset">

                <!-- Left Side Background Slideshow -->
                <div class="col-md-8 col-sm-8 bs-reset">
                    <div class="login-bg">
                        <div class="slide" style="background-image: url('assets/images/WhatsApp Image 2026-06-02 at 3.59.46 PM.jpeg');"></div>
                        <div class="slide" style="background-image: url('assets/images/WhatsApp Image 2026-06-02 at 3.59.50 PM.jpeg');"></div>
                        <div class="slide" style="background-image: url('assets/images/WhatsApp Image 2026-06-02 at 4.00.41 PM.jpeg');"></div>
                    </div>
                </div>

                <!-- Right Side Form Content -->
                <div class="col-md-4 col-sm-4 login-container bs-reset">
                    <div class="login-content">
                        <!-- Branding & Slogan -->
                        <div style="text-align: -webkit-center; margin-bottom: 10px;">
                            <img id="imgFooterLogo" class="login-logo" src="assets/images/itmbu_logo.png"
                                alt="ITM SLS Baroda University Logo">
                        </div>

                        <!-- Role Selector -->
                        <div class="form-group">
                            <label><span class="required">*</span> Role</label>
                            <div id="rblRole">
                                <input id="rblRole_0" type="radio" name="rblRole" value="Staff"><label
                                    for="rblRole_0">Staff</label>
                                <input id="rblRole_1" type="radio" name="rblRole" value="Student"
                                    checked="checked"><label for="rblRole_1">Student</label>
                            </div>
                        </div>

                        <!-- Username Input -->
                        <div class="form-group">
                            <label><span class="required">*</span> Username</label>
                            <input name="txtUsername" type="text" maxlength="50" id="txtUsername" class="form-control"
                                autocomplete="off" placeholder="Mobile No. / Email / Staff Code" value="25C22519" required>
                        </div>

                        <!-- Password Input -->
                        <div class="form-group">
                            <label>
                                <span class="required">*</span> Password
                                <span class="password-info" title="Case Sensitive Password">
                                    <i class="fa fa-info"></i>
                                </span>
                            </label>
                            <input name="txtPassword" maxlength="20" id="txtPassword" class="form-control"
                                type="password" autocomplete="off" placeholder="Password" value="Dhyey$1330" required>

                            <label class="mt-checkbox">
                                <input type="checkbox" id="cbShowPassword"
                                    onchange="ShowPassword(this, document.getElementById('txtPassword'));">
                                <span>Show Password</span>
                            </label>
                        </div>

                        <!-- Action Buttons -->
                        <div style="margin-top: 25px;">
                            <button type="submit" id="btnLogin">Login</button>
                            <button type="button" id="btnForgotPassword"
                                onclick="alert('Password reset link has been dispatched to your registered email address.')">Forgot
                                Password</button>
                        </div>

                        <!-- Passout Student Link -->
                        <div style="text-align: left;">
                            <a id="hlLoginForPassoutStudent" href="LoginForPassoutStudent.aspx">Passout Student Click
                                Here</a>
                        </div>

                        <!-- Chrome Note -->
                        <div class="col-md-12 font-grey-cascasde text-center" style="margin-top: 15px;">
                            <small>Please use Google Chrome for better experience</small>
                        </div>

                        <!-- Maintenance Message -->
                        <div id="div_UndermaintenanceMsg" class="col-md-12 alert alert-danger margin-top-10 g-px-15 g-py-15 text-center">
                            ⚠ System will be under maintenance everyday between 
                            <strong id="strFromTime" class="text-nowrap">11:55 PM</strong> to <strong id="strToTime" class="text-nowrap">12:30 AM</strong>.
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </form>

    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function () {
            // Slideshow Logic
            const slides = document.querySelectorAll(".slide");
            if (slides.length > 0) {
                let currentSlide = 0;
                slides[currentSlide].classList.add("active");
                setInterval(() => {
                    slides[currentSlide].classList.remove("active");
                    currentSlide = (currentSlide + 1) % slides.length;
                    slides[currentSlide].classList.add("active");
                }, 5000);
            }

            // Window Dimensions Track
            document.getElementById("hfWidth").value = window.innerWidth;
            document.getElementById("hfHeight").value = window.innerHeight;

            // Form Submit Interceptor for Mock Dashboard Redirection
            const loginForm = document.getElementById("form1");
            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();

                    const roleSelect = document.querySelector('input[name="rblRole"]:checked');
                    if (roleSelect && roleSelect.value === "Staff") {
                        alert("Invalid Student Credentials. Hint: Select Student Role and use '25C22519' & 'Dhyey$1330'.");
                        return;
                    }

                    const usernameInput = document.getElementById("txtUsername");
                    const passwordInput = document.getElementById("txtPassword");
                    if (usernameInput && passwordInput) {
                        const username = usernameInput.value.trim();
                        const password = passwordInput.value;
                        if ((username === "25C22519" && password === "Dhyey$1330") || (username === "24C22027" && password === "123456")) {
                            // Set login state in localStorage
                            localStorage.setItem("gnums_auth_state", "true");
                            localStorage.setItem("gnums_user_role", "Student");

                            // Resolve redirection path dynamically
                            let redirectPath = "dashboard.html";
                            if (window.location.pathname.endsWith("itmbu.html") && !window.location.pathname.includes("dhyey")) {
                                redirectPath = "Research_paper/dhyey/dashboard.html";
                            } else if (window.location.pathname.endsWith("hehe.html")) {
                                redirectPath = "Research_paper/dhyey/dashboard.html";
                            }
                            window.location.href = redirectPath;
                        } else {
                            alert("Invalid Student Credentials. Hint: Use '25C22519' & 'Dhyey$1330'.");
                        }
                    }
                });
            }
        });

        // Show/Hide Password Visibility Toggle
        function ShowPassword(cbShowPassword, txtPassword) {
            if (cbShowPassword.checked) {
                txtPassword.type = "text";
            } else {
                txtPassword.type = "password";
            }
        }
    </script>
</body>

</html>
